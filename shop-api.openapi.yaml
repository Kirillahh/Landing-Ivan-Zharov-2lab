openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
  contact:
    name: API Team
    email: api@shop.example
  license:
    name: Proprietary
    url: https://shop.example/legal/api-license
  description: |
    ## Назначение
    REST API интернет-магазина: каталоги (`Catalog`), категории (`Category`),
    товары (`Product`) и заказы (`Order`). API работает только в рублях (RUB) -
    отдельного поля `currency` нет, все денежные суммы - целые рубли без копеек.

    ## Соглашение об именовании
    Параметры пути используются в стиле **camelCase** (`catalogId`, `categoryId`,
    `productId`, `orderId`). Поля тел запросов/ответов — в стиле **snake_case**
    (`catalog_id`, `category_id`, `unit_price`, `created_at`), как зафиксировано
    в доменной модели.

    ## Ошибки
    Все ошибки (4xx/5xx, во всех операциях) возвращаются в формате
    `application/problem+json` (RFC 9457), схема `Error`. Используемые типы ошибок:

    | HTTP | `type` (суффикс после `/errors/`)   | Когда возникает                                             |
    |------|--------------------------------------|---------------------------------------------------------------|
    | 400  | `bad-request`                        | Невалидный JSON, битый UUID/число в пути или query            |
    | 401  | `unauthorized`                       | Токен отсутствует или просрочен                               |
    | 403  | `forbidden`                          | Токен есть, но нет нужного scope                              |
    | 404  | `catalog-not-found`                  | Каталог с указанным `id` не найден                            |
    | 404  | `category-not-found`                 | Категория с указанным `id` не найдена                         |
    | 404  | `product-not-found`                  | Товар с указанным `id` не найден                               |
    | 404  | `order-not-found`                    | Заказ с указанным `id` не найден                                |
    | 409  | `duplicate-slug`                     | Слаг каталога/категории уже занят                              |
    | 409  | `duplicate-sku`                      | SKU товара уже существует                                     |
    | 409  | `catalog-has-categories`             | Удаление каталога, в котором есть категории                    |
    | 409  | `idempotency-key-reuse`              | Тот же `Idempotency-Key`, но другое тело запроса               |
    | 422  | `category-inactive`                  | Категория для товара не найдена/неактивна                      |
    | 422  | `product-not-purchasable`            | Товар не `active` или `stock = 0` при оформлении заказа        |
    | 422  | `invalid-status-transition`          | Недопустимый переход статуса заказа                             |
    | 429  | `rate-limit-exceeded`                | Превышен лимит запросов                                       |
    | 500  | `internal-server-error`              | Непредвиденная ошибка сервера (детали не раскрываются)         |

    Поле `errors[]` **обязательно** в ответе 422 (список нарушенных полей),
    для остальных кодов — опционально.

    ## Версионирование
    Используется URI-версионирование: текущая версия — `/v1`.
    - Аддитивные изменения (новые необязательные поля, новые эндпоинты) выходят
      **без смены версии**.
    - Ломающие изменения (переименование/удаление полей, смена типов) выходят
      только под `/v2`; версия `/v1` продолжает поддерживаться **не менее 6 месяцев**
      после выхода `/v2`, и в этот период ответы `/v1` содержат заголовки
      `Deprecation: true` и `Sunset: <RFC 1123 date>`.
    - Клиенты узнают о новой версии из `Deprecation`/`Sunset` заголовков, из
      changelog в этой спецификации (поле `info.version`) и из письма API Team.

    ## Идемпотентность
    `POST /v1/orders` и `POST /v1/products` принимают заголовок
    `Idempotency-Key: <uuid>`.
    - Повторный запрос с тем же ключом и тем же телом в течение **24 часов**
      возвращает сохранённый результат первого запроса (тот же `id`, тот же
      `number`/`sku`), код ответа — **201**.
    - Тот же ключ, но другое тело — **409** с типом `.../idempotency-key-reuse`.
    - Если заголовок не передан — запрос обрабатывается как обычно, но гарантии
      от дублирования нет; это намеренное поведение.

    ## Rate limiting
    Лимит — **100 запросов в минуту** на токен. При превышении — **429** с
    обязательным заголовком `Retry-After` (в секундах). Во всех ответах
    дополнительно передаются заголовки `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, `X-RateLimit-Reset`.
servers:
  - url: https://staging.api.shop.example/v1
    description: Staging — тестовый контур, данные периодически очищаются
  - url: https://api.shop.example/v1
    description: Production — боевой контур
tags:
  - name: catalogs
    description: Управление каталогами (верхний уровень товарной иерархии)
  - name: categories
    description: Иерархия категорий внутри каталогов
  - name: products
    description: Карточки товаров
  - name: orders
    description: Оформление и обработка заказов
security:
  - bearerAuth: []

paths:
  # ============================= CATALOGS =============================
  /catalogs:
    get:
      tags: [catalogs]
      operationId: listCatalogs
      summary: Список каталогов
      description: |
        Возвращает постраничный список каталогов. Публичная операция,
        аутентификация не требуется. Формат пагинации — общий конверт
        `Pagination` (см. `CatalogList`).

        Коды ошибок: 400 (некорректные `page`/`limit`), 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список каталогов
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CatalogList'
              example:
                data:
                  - id: 1
                    name: Электроника
                    slug: electronics
                    description: Смартфоны, ноутбуки, аксессуары
                    is_active: true
                    created_at: '2026-01-10T09:00:00Z'
                    updated_at: '2026-01-10T09:00:00Z'
                pagination:
                  page: 1
                  limit: 20
                  total_items: 4
                  total_pages: 1
                  has_next: false
                  has_prev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [catalogs]
      operationId: createCatalog
      summary: Создать каталог
      description: |
        Создаёт новый каталог верхнего уровня. `slug` должен быть уникален
        глобально. При успехе возвращает `201` с заголовком `Location` и
        телом созданного объекта.

        Коды ошибок: 400, 401, 403 (нет `catalogs:write`), 409
        (`duplicate-slug`), 422, 429, 500.
      security:
        - bearerAuth: [catalogs:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCreate'
            example:
              name: Одежда
              slug: clothing
              description: Мужская, женская и детская одежда
      responses:
        '201':
          description: Каталог создан
          headers:
            Location:
              description: URI созданного ресурса, например `/v1/catalogs/5`
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                id: 5
                name: Одежда
                slug: clothing
                description: Мужская, женская и детская одежда
                is_active: true
                created_at: '2026-02-01T12:00:00Z'
                updated_at: '2026-02-01T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Слаг уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/duplicate-slug
                title: Slug already exists
                status: 409
                detail: Catalog with slug 'clothing' already exists
                instance: /v1/catalogs
                errors:
                  - field: slug
                    code: duplicate
                    message: Slug 'clothing' is already in use
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalogs/{catalogId}:
    get:
      tags: [catalogs]
      operationId: getCatalog
      summary: Получить каталог по id
      description: Публичная операция. Коды ошибок 400, 404, 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/catalogId'
      responses:
        '200':
          description: Каталог найден
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                id: 1
                name: Электроника
                slug: electronics
                description: Смартфоны, ноутбуки, аксессуары
                is_active: true
                created_at: '2026-01-10T09:00:00Z'
                updated_at: '2026-01-10T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [catalogs]
      operationId: updateCatalog
      summary: Частично обновить каталог
      description: |
        Обновление по правилам JSON Merge Patch (RFC 7386): все поля
        необязательны, передаются только изменяемые. Полная замена через
        `PUT` для каталога намеренно не предусмотрена — каталог редко
        заменяется целиком, обычно правится 1-2 поля (см. защиту, вопрос 8).

        Коды ошибок: 400, 401, 403, 404, 409 (`duplicate-slug`), 422, 429, 500.
      security:
        - bearerAuth: [catalogs:write]
      parameters:
        - $ref: '#/components/parameters/catalogId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CatalogUpdate'
            example:
              description: Смартфоны, ноутбуки, планшеты, аксессуары
              is_active: true
      responses:
        '200':
          description: Каталог обновлён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [catalogs]
      operationId: deleteCatalog
      summary: Удалить каталог
      description: |
        Удаление запрещено, если у каталога есть хотя бы одна категория —
        в этом случае возвращается `409 catalog-has-categories`. Сначала
        нужно удалить/перенести категории. При успехе — `204` без тела.

        Коды ошибок: 400, 401, 403, 404, 409, 429, 500.
      security:
        - bearerAuth: [catalogs:write]
      parameters:
        - $ref: '#/components/parameters/catalogId'
      responses:
        '204':
          description: Каталог удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: У каталога есть категории
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/catalog-has-categories
                title: Catalog has categories
                status: 409
                detail: Catalog '1' still has 3 categories and cannot be deleted
                instance: /v1/catalogs/1
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================ CATEGORIES ============================
  /catalogs/{catalogId}/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Список категорий каталога
      description: |
        Постраничный список категорий внутри указанного каталога.
        Публичная операция. Коды ошибок: 400, 404 (каталог не найден), 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/catalogId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список категорий
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CategoryList'
              example:
                data:
                  - id: 10
                    catalog_id: 1
                    name: Ноутбуки
                    slug: laptops
                    image_url: https://cdn.shop.example/cat/laptops.jpg
                    sort_order: 0
                    is_active: true
                    created_at: '2026-01-11T09:00:00Z'
                    updated_at: '2026-01-11T09:00:00Z'
                pagination:
                  page: 1
                  limit: 20
                  total_items: 1
                  total_pages: 1
                  has_next: false
                  has_prev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [categories]
      operationId: createCategory
      summary: Создать категорию в каталоге
      description: |
        `slug` должен быть уникален в пределах каталога (но может повторяться
        в разных каталогах). Коды ошибок: 400, 401, 403, 404 (каталог не
        найден), 409 (`duplicate-slug`), 422, 429, 500.
      security:
        - bearerAuth: [catalogs:write]
      parameters:
        - $ref: '#/components/parameters/catalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
            example:
              name: Игровые ноутбуки
              slug: gaming-laptops
              image_url: https://cdn.shop.example/cat/gaming-laptops.jpg
              sort_order: 1
      responses:
        '201':
          description: Категория создана
          headers:
            Location:
              description: URI созданного ресурса, например `/v1/categories/42`
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /categories/{categoryId}:
    get:
      tags: [categories]
      operationId: getCategory
      summary: Получить категорию по id
      description: 'Публичная операция. Коды ошибок: 400, 404, 429, 500.'
      security: []
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Категория найдена
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Частично обновить категорию
      description: |
        JSON Merge Patch (RFC 7386), все поля необязательны.
        Коды ошибок: 400, 401, 403, 404, 409 (`duplicate-slug`), 422, 429, 500.
      security:
        - bearerAuth: [catalogs:write]
      parameters:
        - $ref: '#/components/parameters/categoryId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              sort_order: 2
              is_active: false
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================= PRODUCTS =============================
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров с фильтрами
      description: |
        Постраничный список товаров. Публичная операция. Поддерживает поиск
        и фильтрацию через query-параметры `q`, `category_id`, `status`,
        `min_price`, `max_price`, а также сортировку `sort` + `direction`.

        Коды ошибок: 400 (например, `min_price > max_price`, `q` короче 2
        символов), 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: q
          in: query
          required: false
          description: Поиск по `name`/`sku`, минимум 2 символа
          schema:
            type: string
            minLength: 2
          example: ноутбук
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          example: 10
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: min_price
          in: query
          required: false
          description: Минимальная цена в рублях
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 10000
        - name: max_price
          in: query
          required: false
          description: Максимальная цена в рублях
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 200000
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, price, created_at]
            default: created_at
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Список товаров
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProductList'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    sku: NB-IGR-156
                    name: Игровой ноутбук 15.6"
                    description: 16 ГБ ОЗУ, RTX 4060, 512 ГБ SSD
                    category_id: 10
                    price: 149990
                    stock: 12
                    status: active
                    images:
                      - https://cdn.shop.example/p/nb-igr-156-1.jpg
                    created_at: '2026-01-15T10:00:00Z'
                    updated_at: '2026-01-15T10:00:00Z'
                pagination:
                  page: 1
                  limit: 20
                  total_items: 1
                  total_pages: 1
                  has_next: false
                  has_prev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [products]
      operationId: createProduct
      summary: Создать товар
      description: |
        `sku` должен быть уникален; нарушение уникальности — `409`.
        `category_id` должен ссылаться на существующую и **активную**
        категорию, иначе — `422 category-inactive`.

        Поддерживает необязательный заголовок `Idempotency-Key` с тем же
        поведением, что описано в `info.description`.

        Коды ошибок: 400, 401, 403, 404 (категория не найдена), 409
        (`duplicate-sku` / `idempotency-key-reuse`), 422, 429, 500.
      security:
        - bearerAuth: [products:write]
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              sku: NB-IGR-156
              name: Игровой ноутбук 15.6"
              description: 16 ГБ ОЗУ, RTX 4060, 512 ГБ SSD
              category_id: 10
              price: 149990
              stock: 12
              status: draft
              images:
                - https://cdn.shop.example/p/nb-igr-156-1.jpg
      responses:
        '201':
          description: Товар создан (или повторно возвращён по Idempotency-Key)
          headers:
            Location:
              schema:
                type: string
              description: >-
                URI созданного ресурса, например
                `/v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6`
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Категория не найдена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Дубликат SKU либо переиспользование Idempotency-Key с другим телом
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/duplicate-sku
                title: SKU already exists
                status: 409
                detail: SKU 'NB-IGR-156' already exists
                instance: /v1/products
                errors:
                  - field: sku
                    code: duplicate
                    message: SKU 'NB-IGR-156' already exists
        '422':
          description: Категория неактивна
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/category-inactive
                title: Category is not active
                status: 422
                detail: Category '10' is inactive and cannot accept new products
                instance: /v1/products
                errors:
                  - field: category_id
                    code: inactive
                    message: Category '10' is not active
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Получить товар по id
      description: 'Публичная операция. Коды ошибок: 400, 404, 429, 500.'
      security: []
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Товар найден
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [products]
      operationId: replaceProduct
      summary: Полностью заменить товар
      description: |
        Полная замена карточки товара (все поля, кроме серверных,
        обязательны — используется, когда фронтенд/интеграция присылает
        карточку целиком, например при синхронизации с внешним PIM).
        В отличие от `PATCH`, отсутствующее в теле поле сбрасывается к его
        семантике "не задано" там, где это применимо (см. защиту, вопрос 8).

        Коды ошибок: 400, 401, 403, 404, 409 (`duplicate-sku`), 422, 429, 500.
      security:
        - bearerAuth: [products:write]
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductReplace'
      responses:
        '200':
          description: Товар заменён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Частично обновить товар
      description: |
        JSON Merge Patch (RFC 7386): передаются только изменяемые поля —
        удобно для точечных правок (например, изменить только `price` или
        `stock`), в отличие от `PUT`, где нужно прислать весь объект.

        Коды ошибок: 400, 401, 403, 404, 409 (`duplicate-sku`), 422, 429, 500.
      security:
        - bearerAuth: [products:write]
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              price: 139990
              stock: 8
              status: active
      responses:
        '200':
          description: Товар обновлён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================== ORDERS ===============================
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список заказов
      description: |
        Постраничный список заказов. Требует scope `orders:read`.
        Коды ошибок: 400, 401, 403, 429, 500.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      security:
        - bearerAuth: [orders:read]
      responses:
        '200':
          description: Список заказов
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Оформить заказ
      description: |
        Создаёт заказ по списку `items` (1–100 позиций). Для каждой позиции
        сервер проверяет, что товар существует, имеет `status: active` и
        `stock > 0`, иначе — `422 product-not-purchasable`. `unit_price`
        каждой позиции и `total_amount` заказа вычисляются и фиксируются
        сервером — клиент их не передаёт.

        `Idempotency-Key` обязателен к поддержке клиентом: повторная отправка
        с тем же ключом и тем же телом в течение 24 часов возвращает тот же
        заказ (тот же `id`, тот же `number`), код `201`; с другим телом — `409`.

        Коды ошибок: 400, 401, 403, 404 (товар не найден), 409
        (`idempotency-key-reuse`), 422 (`product-not-purchasable`), 429, 500.
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              customer:
                name: Иван Петров
                email: ivan.petrov@example.com
                phone: '+79261234567'
              items:
                - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quantity: 1
      responses:
        '201':
          description: Заказ создан (или повторно возвращён по Idempotency-Key)
          headers:
            Location:
              schema:
                type: string
              description: URI созданного ресурса, например `/v1/orders/42`
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 42
                number: ORD-2026-000042
                customer:
                  name: Иван Петров
                  email: ivan.petrov@example.com
                  phone: '+79261234567'
                items:
                  - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    quantity: 1
                    unit_price: 149990
                status: pending
                total_amount: 149990
                created_at: '2026-02-10T14:00:00Z'
                updated_at: '2026-02-10T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Один из товаров не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Тот же Idempotency-Key, но другое тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/idempotency-key-reuse
                title: Idempotency key reused with a different body
                status: 409
                detail: "Key 'b0e1...': request body differs from the original request"
                instance: /v1/orders
        '422':
          description: Товар нельзя купить (не активен или нет остатка)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/product-not-purchasable
                title: Product is not purchasable
                status: 422
                detail: Product '3fa85f64-5717-4562-b3fc-2c963f66afa6' has stock = 0
                instance: /v1/orders
                errors:
                  - field: items[0].product_id
                    code: out_of_stock
                    message: Product has no stock available
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получить заказ по id
      description: 'Требует scope `orders:read`. Коды ошибок: 400, 401, 403, 404, 429, 500.'
      security:
        - bearerAuth: [orders:read]
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Заказ найден
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Изменить статус заказа
      description: |
        Единственный способ изменить заказ после оформления — смена статуса
        (JSON Merge Patch с единственным допустимым полем `status`; товарные
        позиции и сумма после оформления неизменны).

        Допустимые переходы статуса:

        ```
        pending → confirmed → shipped → delivered
          ↓
        cancelled
        ```

        - Из `pending` разрешён переход в `confirmed` или `cancelled`.
        - Из `confirmed` разрешён переход в `shipped` или `cancelled`.
        - Из `shipped` разрешён только переход в `delivered`.
        - `delivered` и `cancelled` — финальные статусы, из них переход
          невозможен.

        Любой переход вне этой матрицы (включая переход в тот же статус)
        возвращает `422 invalid-status-transition`.

        Коды ошибок: 400, 401, 403, 404, 422, 429, 500.
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
            example:
              status: confirmed
      responses:
        '200':
          description: Статус заказа изменён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Недопустимый переход статуса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://api.shop.example/errors/invalid-status-transition
                title: Invalid order status transition
                status: 422
                detail: Cannot transition order from 'delivered' to 'cancelled'
                instance: /v1/orders/42
                errors:
                  - field: status
                    code: invalid_transition
                    message: "'delivered' is a final status"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT-токен, передаётся в заголовке `Authorization: Bearer <token>`.
        Доступные scopes: `catalogs:read`, `catalogs:write`, `products:read`,
        `products:write`, `orders:read`, `orders:write`. Операции чтения
        каталогов/категорий/товаров публичны и security не требуют
        (`security: []` на уровне операции).

  parameters:
    page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      example: 1
    limit:
      name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    catalogId:
      name: catalogId
      in: path
      required: true
      description: Идентификатор каталога
      schema:
        type: integer
        format: int64
      example: 1
    categoryId:
      name: categoryId
      in: path
      required: true
      description: Идентификатор категории
      schema:
        type: integer
        format: int64
      example: 10
    productId:
      name: productId
      in: path
      required: true
      description: Идентификатор товара (UUID)
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    orderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа
      schema:
        type: integer
        format: int64
      example: 42
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        UUID, гарантирующий идемпотентность повторной отправки одного и того
        же запроса в течение 24 часов. См. политику в `info.description`.
      schema:
        type: string
        format: uuid
      example: b0e1a6d2-9d4d-4b2b-8f2a-1a2b3c4d5e6f

  headers:
    X-RateLimit-Limit:
      description: Лимит запросов в минуту на токен
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: Сколько запросов осталось в текущем окне
      schema:
        type: integer
        example: 42
    X-RateLimit-Reset:
      description: Через сколько секунд окно лимита обнулится
      schema:
        type: integer
        example: 37
    Retry-After:
      description: Через сколько секунд можно повторить запрос
      schema:
        type: integer
        example: 20

  responses:
    BadRequest:
      description: Некорректный запрос (невалидный JSON, битый UUID/число в пути)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/bad-request
            title: Bad request
            status: 400
            detail: "'productId' is not a valid UUID"
            instance: /v1/products/not-a-uuid
    Unauthorized:
      description: Токен отсутствует или просрочен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: Access token is missing or expired
            instance: /v1/orders
    Forbidden:
      description: Токен есть, но нет нужного scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/forbidden
            title: Forbidden
            status: 403
            detail: Token does not have the 'orders:read' scope
            instance: /v1/orders
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/product-not-found
            title: Product not found
            status: 404
            detail: Product with id '3fa85f64-5717-4562-b3fc-2c963f66afa6' was not found
            instance: /v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict:
      description: Конфликт состояния или уникальности
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/duplicate-slug
            title: Slug already exists
            status: 409
            detail: Slug 'laptops' already exists in this catalog
            instance: /v1/catalogs/1/categories
            errors:
              - field: slug
                code: duplicate
                message: Slug 'laptops' is already in use
    UnprocessableEntity:
      description: Тело валидно по схеме, но нарушает бизнес-правило
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/category-inactive
            title: Category is not active
            status: 422
            detail: Category '10' is inactive
            instance: /v1/products
            errors:
              - field: category_id
                code: inactive
                message: Category '10' is not active
    TooManyRequests:
      description: Превышен лимит запросов (100 req/min на токен)
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/rate-limit-exceeded
            title: Too many requests
            status: 429
            detail: Rate limit of 100 requests per minute exceeded
            instance: /v1/products
    InternalError:
      description: Непредвиденная ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/internal-server-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred
            instance: /v1/products

  schemas:
    # ---------------------------- ERROR ----------------------------
    Error:
      type: object
      description: Тело ошибки в формате RFC 9457 (`application/problem+json`)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки, см. таблицу в `info.description`
          example: https://api.shop.example/errors/product-not-found
        title:
          type: string
          description: Краткое человекочитаемое описание
          example: Product not found
        status:
          type: integer
          description: HTTP-код ответа
          example: 404
        detail:
          type: string
          description: Контекст — что именно не так
          example: Product with id '...' was not found
        instance:
          type: string
          description: Путь запроса, вызвавшего ошибку
          example: /v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6
        errors:
          type: array
          description: Полевые ошибки; обязателен при `422`, опционален для остальных кодов
          items:
            $ref: '#/components/schemas/ErrorField'
    ErrorField:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Путь до невалидного поля
          example: sku
        code:
          type: string
          description: Машиночитаемый код нарушения
          example: duplicate
        message:
          type: string
          description: Человекочитаемое описание нарушения
          example: SKU 'ABC-123' already exists

    # -------------------------- PAGINATION --------------------------
    Pagination:
      type: object
      description: Общий конверт метаданных пагинации, переиспользуется во всех списках
      required: [page, limit, total_items, total_pages, has_next, has_prev]
      properties:
        page:
          type: integer
          format: int32
          example: 1
        limit:
          type: integer
          format: int32
          example: 20
        total_items:
          type: integer
          format: int64
          example: 137
        total_pages:
          type: integer
          format: int32
          example: 7
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false

    # ---------------------------- CATALOG ----------------------------
    Catalog:
      type: object
      description: Каталог — верхний уровень товарной иерархии (например, «Электроника»)
      required: [id, name, slug, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Генерируется сервером
          example: 1
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Электроника
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 60
          description: Уникален глобально; задаётся только при создании
          example: electronics
        description:
          type: string
          maxLength: 500
          example: Смартфоны, ноутбуки, аксессуары
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: RFC 3339, UTC. Только в ответе, в запросах игнорируется
          example: '2026-01-10T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: RFC 3339, UTC. Только в ответе, в запросах игнорируется
          example: '2026-01-10T09:00:00Z'
    CatalogCreate:
      type: object
      description: Тело запроса для создания каталога (`POST /v1/catalogs`)
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Одежда
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 60
          example: clothing
        description:
          type: string
          maxLength: 500
        is_active:
          type: boolean
          default: true
    CatalogUpdate:
      type: object
      description: >-
        Тело запроса JSON Merge Patch (`PATCH /v1/catalogs/{catalogId}`),
        все поля необязательны
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500
        is_active:
          type: boolean
    CatalogList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Catalog'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # --------------------------- CATEGORY ---------------------------
    Category:
      type: object
      description: 'Категория; иерархия: «Электроника → Ноутбуки → Игровые ноутбуки»'
      required: [id, catalog_id, name, slug, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 10
        catalog_id:
          type: integer
          format: int64
          description: Каталог должен существовать, иначе `422`
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Ноутбуки
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Уникален в пределах каталога
          example: laptops
        image_url:
          type: string
          format: uri
          example: https://cdn.shop.example/cat/laptops.jpg
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-11T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-11T09:00:00Z'
    CategoryCreate:
      type: object
      description: Тело запроса для создания категории (`catalog_id` берётся из пути)
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        image_url:
          type: string
          format: uri
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
    CategoryUpdate:
      type: object
      description: Тело запроса JSON Merge Patch, все поля необязательны
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        image_url:
          type: string
          format: uri
        sort_order:
          type: integer
          format: int32
        is_active:
          type: boolean
    CategoryList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ---------------------------- PRODUCT ----------------------------
    ProductStatus:
      type: string
      enum: [draft, active, archived]
      default: draft
    Product:
      type: object
      description: Товар — схема для ответов (чтения)
      required: [id, sku, name, category_id, price, stock, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Генерируется сервером (UUID v4)
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        sku:
          type: string
          pattern: '^[A-Z0-9-]+$'
          minLength: 5
          maxLength: 32
          description: Уникален; нарушение уникальности — `409`
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
        category_id:
          type: integer
          format: int64
          description: "Категория должна существовать и быть `is_active: true`, иначе `422`"
          example: 10
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          description: Цена в рублях, целое число, без копеек
          example: 149990
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          example: 12
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          example: ['https://cdn.shop.example/p/nb-igr-156-1.jpg']
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ProductCreate:
      type: object
      description: Тело запроса для создания товара (`POST /v1/products`)
      required: [sku, name, category_id, price, stock]
      properties:
        sku:
          type: string
          pattern: '^[A-Z0-9-]+$'
          minLength: 5
          maxLength: 32
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        category_id:
          type: integer
          format: int64
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
    ProductReplace:
      type: object
      description: >-
        Тело запроса для полной замены товара (`PUT /v1/products/{productId}`).
        В отличие от `ProductCreate`, `status` обязателен явно (нет
        подразумеваемого `draft` по умолчанию при замене).
      required: [sku, name, category_id, price, stock, status]
      properties:
        sku:
          type: string
          pattern: '^[A-Z0-9-]+$'
          minLength: 5
          maxLength: 32
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        category_id:
          type: integer
          format: int64
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
    ProductUpdate:
      type: object
      description: >-
        Тело запроса JSON Merge Patch (RFC 7386) для `PATCH
        /v1/products/{productId}` — все поля необязательны
      properties:
        sku:
          type: string
          pattern: '^[A-Z0-9-]+$'
          minLength: 5
          maxLength: 32
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        category_id:
          type: integer
          format: int64
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
        status:
          $ref: '#/components/schemas/ProductStatus'
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
    ProductList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ----------------------------- ORDER -----------------------------
    OrderStatus:
      type: string
      enum: [pending, confirmed, shipped, delivered, cancelled]
      default: pending
      description: >-
        Матрица переходов описана в `updateOrderStatus`.
        `delivered` и `cancelled` — финальные статусы.
    Customer:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Иван Петров
        email:
          type: string
          format: email
          example: ivan.petrov@example.com
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: Формат E.164
          example: '+79261234567'
    OrderItem:
      type: object
      description: Позиция заказа — схема для ответа (чтения)
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
          description: "Товар должен существовать, `status: active`, `stock > 0`, иначе `422`"
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          example: 1
        unit_price:
          type: integer
          format: int64
          readOnly: true
          description: >-
            Не передаётся клиентом — сервер копирует `Product.price` на
            момент создания заказа, чтобы последующее изменение цены товара
            не искажало историю заказов
          example: 149990
    OrderItemCreate:
      type: object
      description: >-
        Позиция заказа в теле запроса на создание. Поля `unit_price` здесь
        намеренно нет — оно всегда вычисляется сервером
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    Order:
      type: object
      description: Заказ — схема для ответа (чтения)
      required:
        - id
        - number
        - customer
        - items
        - status
        - total_amount
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        number:
          type: string
          readOnly: true
          pattern: '^ORD-\d{4}-\d{6}$'
          description: Генерируется сервером, уникален
          example: ORD-2026-000042
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: integer
          format: int64
          readOnly: true
          description: Сумма `unit_price × quantity` по всем `items`, в рублях, считается сервером
          example: 149990
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    OrderCreate:
      type: object
      description: >-
        Тело запроса для оформления заказа (`POST /v1/orders`). Поля
        `status` (всегда стартует как `pending`), `unit_price` и
        `total_amount` в запросе отсутствуют — вычисляются сервером
      required: [customer, items]
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemCreate'
    OrderList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
